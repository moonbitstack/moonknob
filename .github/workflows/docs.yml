name: Docs

# The site is built from `docs/` and published by Pages. Nothing built for it is
# committed: the library is compiled to JavaScript in the run, and the reference
# page is written from the sources, so a page that no longer matches the code
# cannot be deployed.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: build the library for the plate
        run: |
          moon update
          moon build --target js --release src/examples/browser
          mkdir -p docs/engine
          cp _build/js/release/build/examples/browser/browser.js docs/engine/moonknob.js

      - name: the reference follows the sources
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - name: the code on the pages compiles
        run: python3 scripts/check_snippets.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
